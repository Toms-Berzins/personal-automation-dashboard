name: Code Review & CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write
  checks: write
  issues: write

jobs:
  code-review:
    name: Automated Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Backend Code Review
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Backend - ESLint Review
        working-directory: ./backend
        run: npm run lint
        continue-on-error: true

      # Frontend Code Review
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend - ESLint Review
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true

      - name: Frontend - TypeScript Check
        working-directory: ./frontend
        run: |
          npx tsc --noEmit || echo "TypeScript errors found"
        continue-on-error: true

      # Reviewdog for inline comments (PR only - github-pr-review requires PR context)
      - name: Setup Reviewdog
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Run Reviewdog - ESLint (Backend)
        if: github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ./backend
        run: |
          npx eslint . --format=checkstyle | \
          reviewdog -f=checkstyle -name="ESLint (Backend)" -reporter=github-pr-review -level=warning
        continue-on-error: true

      - name: Run Reviewdog - ESLint (Frontend)
        if: github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ./frontend
        run: |
          npx eslint . --format=checkstyle | \
          reviewdog -f=checkstyle -name="ESLint (Frontend)" -reporter=github-pr-review -level=warning
        continue-on-error: true

  ai-code-review:
    name: AI-Powered Code Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Note: OPENAI_API_KEY is optional. The step will be skipped if not set.
      # The linter warning about invalid context access is a false positive for optional secrets.
      - name: AI Code Reviewer
        uses: freeedcom/ai-codereviewer@main
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_MODEL: "gpt-4"
          exclude: "*.md,*.json,*.yml,*.yaml,package-lock.json"
        continue-on-error: true

  security-review:
    name: Security Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'personal-automation-dashboard'
          path: '.'
          format: 'HTML'
        continue-on-error: true

  quality-gates:
    name: Code Quality Gates
    runs-on: ubuntu-latest
    needs: [code-review, ai-code-review, security-review]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Check Code Complexity
        run: |
          echo "Code complexity analysis skipped - complexity-report package not available"
          echo "Consider using ESLint complexity rules or alternative tools like plato/es6-plato"
        continue-on-error: true

      - name: Generate Review Summary
        env:
          CODE_REVIEW_RESULT: ${{ needs.code-review.result }}
          AI_REVIEW_RESULT: ${{ needs.ai-code-review.result }}
          SECURITY_RESULT: ${{ needs.security-review.result }}
        run: |
          echo "## Code Review Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Determine overall status
          if [[ "$CODE_REVIEW_RESULT" == "success" && "$SECURITY_RESULT" == "success" && ("$AI_REVIEW_RESULT" == "success" || "$AI_REVIEW_RESULT" == "skipped") ]]; then
            echo "✅ All code review checks completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Some code review checks had issues" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Check Results:" >> $GITHUB_STEP_SUMMARY

          # Code Review status
          if [[ "$CODE_REVIEW_RESULT" == "success" ]]; then
            echo "- ✅ ESLint & TypeScript (Backend & Frontend)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ ESLint & TypeScript (Backend & Frontend): $CODE_REVIEW_RESULT" >> $GITHUB_STEP_SUMMARY
          fi

          # AI Review status
          if [[ "$AI_REVIEW_RESULT" == "success" ]]; then
            echo "- ✅ AI-Powered Review" >> $GITHUB_STEP_SUMMARY
          elif [[ "$AI_REVIEW_RESULT" == "skipped" ]]; then
            echo "- ⏭️ AI-Powered Review (PR only)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ AI-Powered Review: $AI_REVIEW_RESULT" >> $GITHUB_STEP_SUMMARY
          fi

          # Security Review status
          if [[ "$SECURITY_RESULT" == "success" ]]; then
            echo "- ✅ Security Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Security Vulnerability Scan: $SECURITY_RESULT" >> $GITHUB_STEP_SUMMARY
          fi

          echo "- ℹ️ Code Complexity Analysis (informational)" >> $GITHUB_STEP_SUMMARY
